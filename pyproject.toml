[project]
name = "kelvin"
version = "0.1.0"
description = "Lab Infra Chat CLI with persistent storage and tool calling"
readme = "README.md"
authors = [
    { name = "@val314159", email = "jmward@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "docopt-ng>=0.9.0",
    "openai>=2.31.0",
    "prompt-toolkit>=3.0.52",
    "PyYAML>=6.0.2",
]

[project.scripts]
kelvin = "kelvin.cli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv_build]
include = ["src/kelvin/prompts/**/*"]
